
{% extends "base.html" %}

{% block content %}
<h1>My Appointments</h1>

<table border="1" cellpadding="10">
    <tr>
        <th>Service</th>
        <th>Date</th>
        <th>Time</th>
        <th>Status</th>
    </tr>

    {% for appointment in appointments %}
    <tr>
        <td>{{ appointment.service }}</td>
        <td>{{ appointment.date }}</td>
        <td>{{ appointment.time }}</td>
        <td>{{ appointment.status }}</td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
