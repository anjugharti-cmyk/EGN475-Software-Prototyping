
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Bella Vista Salon{% endblock %}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #fff8f5;
            color: #333;
        }

        header {
            background-color: #b76e79;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: #f3d9d5;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: #633b3b;
            text-decoration: none;
            margin: 12px;
            font-weight: bold;
        }

        nav a:hover {
            color: #b76e79;
        }

        main {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
        }

        footer {
            background-color: #b76e79;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
        }

        button, input, select {
            padding: 10px;
            margin: 5px 0;
        }
    </style>

    {% block extra_head %}{% endblock %}
</head>

<body>

    <header>
        <h1>Bella Vista Salon</h1>
        <p>Beauty, Style and Confidence</p>
    </header>

    <nav>
        <a href="{{ url_for('index') }}">Home</a>
        <a href="{{ url_for('services') }}">Services</a>
        <a href="{{ url_for('book') }}">Book Appointment</a>
        <a href="{{ url_for('calendar') }}">Calendar</a>
        <a href="{{ url_for('appointments') }}">My Appointments</a>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 Bella Vista Salon. All rights reserved.</p>
    </footer>

</body>
</html>
