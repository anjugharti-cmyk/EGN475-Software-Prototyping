{% extends "base.html" %}

{% block content %}
<h1>{{ service.name }}</h1>

<p><strong>Duration:</strong> {{ service.duration }} minutes</p>

<p>
    <strong>Price:</strong>
    ${{ "%.2f"|format(service.price_cents / 100) }}
</p>

<a href="{{ url_for('book') }}">Book This Service</a>

<br><br>

<a href="{{ url_for('services') }}">Back to Services</a>
{% endblock %}
