{% extends "base.html" %}

{% block content %}
<h1>Our Services</h1>

{% for service in services %}
<div>
    <h2>{{ service.name }}</h2>
    <p>Duration: {{ service.duration }} minutes</p>
    <p>Price: ${{ "%.2f"|format(service.price_cents / 100) }}</p>

    <a href="{{ url_for('service_detail', service_id=service.id) }}">
        View Details
    </a>
</div>
<hr>
{% endfor %}

{% endblock %}
