
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bella Vista Salon - Services</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>Bella Vista Salon</h1>
            <nav>
                <ul>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="my-appointments.html">My Appointments</a></li>
                    <li><a href="staff-calendar.html">Staff Calendar</a></li>
                    <li><a href="services-admin.html">Admin</a></li>
                </ul>
            </nav>
        </header>

        <hr>

        <h2>Choose a Service</h2>
        <p>Select the salon service you would like to book.</p>

        <form action="choose-date-time.html">
            <fieldset>
                <label>
                    <input type="radio" name="service" value="Haircut" required>
                    <strong>Haircut</strong> — $35 (45 minutes)
                </label>

                <label>
                    <input type="radio" name="service" value="Hair Coloring">
                    <strong>Hair Coloring</strong> — $75 (90 minutes)
                </label>

                <label>
                    <input type="radio" name="service" value="Manicure">
                    <strong>Manicure</strong> — $25 (30 minutes)
                </label>

                <label>
                    <input type="radio" name="service" value="Hair Styling">
                    <strong>Hair Styling</strong> — $45 (60 minutes)
                </label>
            </fieldset>

            <button type="submit">Continue</button>
        </form>

        <footer>
            <hr>
            <p>Bella Vista Salon | Contact Information</p>
        </footer>
    </main>
</body>
</html>
