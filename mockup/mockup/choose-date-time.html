
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bella Vista Salon - Choose Date and Time</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>Bella Vista Salon</h1>
            <nav>
                <ul>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="my-appointments.html">My Appointments</a></li>
                    <li><a href="staff-calendar.html">Staff Calendar</a></li>
                    <li><a href="services-admin.html">Admin</a></li>
                </ul>
            </nav>
        </header>

        <hr>

        <h2>Choose Date and Time</h2>
        <p>Selected Service: Haircut</p>
        <p>Price: $35 | Duration: 45 minutes</p>

        <form action="review-confirm.html">
            <label for="appointment-date">Select Appointment Date</label>
            <input type="date" id="appointment-date" name="date"
                   min="2026-11-17" max="2027-02-15" required>

            <h3>Available Time Slots</h3>

            <fieldset>
                <label>
                    <input type="radio" name="time" value="9:00 AM" required>
                    9:00 AM
                </label>
                <label>
                    <input type="radio" name="time" value="10:00 AM">
                    10:00 AM
                </label>
                <label>
                    <input type="radio" name="time" value="11:00 AM">
                    11:00 AM
                </label>
                <label>
                    <input type="radio" name="time" value="1:00 PM">
                    1:00 PM
                </label>
                <label>
                    <input type="radio" name="time" value="2:00 PM">
                    2:00 PM
                </label>
                <label>
                    <input type="radio" name="time" value="3:00 PM">
                    3:00 PM
                </label>
            </fieldset>

            <h3>Customer Information</h3>

            <label for="customer-name">Full Name</label>
            <input type="text" id="customer-name" name="name"
                   placeholder="Enter your full name" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone"
                   placeholder="Enter your phone number">

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email address">

            <div class="grid">
                <a href="services.html" role="button" class="secondary">Back</a>
                <button type="submit">Continue</button>
            </div>
        </form>

        <footer>
            <hr>
            <p>Bella Vista Salon | Contact Information</p>
        </footer>
    </main>
</body>
</html>
